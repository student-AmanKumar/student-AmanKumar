
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="510" viewBox="0 0 1000 510">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101a30"/>
      <stop offset="1" stop-color="#070b16"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#63c5ff"/>
      <stop offset="1" stop-color="#247bff"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c7b2ff"/>
      <stop offset="1" stop-color="#8055ff"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff98a8"/>
      <stop offset="1" stop-color="#ff354f"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#247bff"/>
      <stop offset=".5" stop-color="#9865ff"/>
      <stop offset="1" stop-color="#ff354f"/>
      <animate attributeName="x1" values="0;.3;0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#8195bd" opacity=".18"/>
    </pattern>
    <clipPath id="logoClip">
      <circle cx="858" cy="139" r="52"/>
    </clipPath>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .head{font-family:Arial,Helvetica,sans-serif;font-weight:800;letter-spacing:2px}
      .body{font-family:Arial,Helvetica,sans-serif}
      .small{font-family:Arial,Helvetica,sans-serif;font-size:11px;letter-spacing:1.5px}
      .card{fill:#0c1325;stroke:#293752;stroke-width:1}
      .white{fill:#f4f7ff}
      .muted{fill:#9ba9c5}
      .blueText{fill:#72c4ff}
      .violetText{fill:#c0aaff}
      .redText{fill:#ff8798}
    </style>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1000" height="510" rx="22" fill="url(#bg)"/>
  <rect width="1000" height="510" rx="22" fill="url(#dots)"/>
  <circle cx="110" cy="100" r="100" fill="#247bff" opacity=".06"/>
  <circle cx="900" cy="420" r="110" fill="#ff354f" opacity=".05"/>
  <rect x="1" y="1" width="998" height="508" rx="21" fill="none" stroke="#34425f"/>

  <!-- TOP LABEL -->
  <circle cx="42" cy="40" r="4" fill="#63c5ff" filter="url(#glow)">
    <animate attributeName="opacity" values=".3;1;.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="56" y="44" class="small" fill="#b8c9e8">AMAN KUMAR / CAREER LOG</text>
  <text x="958" y="44" text-anchor="end" class="small" fill="#7182a3">2026 — EXPERIENCE</text>

  <!-- HERO -->
  <text x="40" y="94" class="small" fill="#72c4ff">LEARNING · BUILDING · ANALYSING</text>
  <text x="38" y="145" class="head white" font-size="41">INTERNSHIP</text>
  <text x="38" y="190" class="head white" font-size="41">EXPERIENCE<tspan fill="#438dff">.</tspan></text>
  <text x="41" y="215" class="body muted" font-size="13">Turning practical tasks into skills, projects and real progress.</text>

  <!-- PERSONAL LOGO INSTEAD OF ORBIT ANIMATION -->
  <circle cx="858" cy="139" r="62" fill="#111d35" stroke="url(#flow)" stroke-width="2">
    <animate attributeName="stroke-opacity" values=".55;1;.55" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="858" cy="139" r="56" fill="#070b16" stroke="#30415f" stroke-width="1"/>
 
<image
    x="806"
    y="87"
    width="104"
    height="104"
    preserveAspectRatio="xMidYMid meet"
    clip-path="url(#logoClip)"
    href="/me.png"
/>
  
  <circle cx="858" cy="139" r="58" fill="none" stroke="url(#flow)" stroke-width="1.5" stroke-dasharray="4 7">
    <animateTransform attributeName="transform" type="rotate" from="0 858 139" to="360 858 139" dur="18s" repeatCount="indefinite"/>
  </circle>

  <!-- CODEALPHA CARD -->
  <rect x="35" y="245" width="296" height="159" rx="14" class="card"/>
  <rect x="35" y="245" width="296" height="2" rx="1" fill="url(#blue)"/>
  <rect x="53" y="262" width="44" height="44" rx="10" fill="#ffffff"/>
  
<image
  x="57"
  y="266"
  width="35" 
  height="40"
  preserveAspectRatio="xMidYMid meet"
  href="data:image/png;base64,"
/>

  <text x="106" y="278" class="head white" font-size="16">CodeAlpha</text>
  <text x="106" y="295" class="small blueText" font-size="9">FRONTEND DEVELOPMENT</text>
  <rect x="53" y="316" width="112" height="22" rx="11" fill="#142a46" stroke="#244a77"/>
  <circle cx="65" cy="327" r="3" fill="#63c5ff"/>
  <text x="74" y="331" class="body blueText" font-size="10">INTERN · 2026</text>
  <text x="53" y="360" class="body muted" font-size="11.5">Responsive web experiences</text>
  <text x="53" y="379" class="body muted" font-size="11.5">Interactive UI &amp; web projects</text>
  <path d="M53 391 H313" stroke="#293752"/>

  <!-- CODSOFT CARD -->
  <rect x="352" y="245" width="296" height="159" rx="14" class="card"/>
  <rect x="352" y="245" width="296" height="2" rx="1" fill="url(#violet)"/>
  <rect x="370" y="262" width="44" height="44" rx="10" fill="#ffffff"/>



<image
    x="374"
    y="266"
    width="40"
    height="40"
    preserveAspectRatio="xMidYMid meet"
    href="codsoft.png"
/>


  <text x="423" y="278" class="head white" font-size="16">CodSoft</text>
  <text x="423" y="295" class="small violetText" font-size="9">DATA ANALYTICS</text>
  <rect x="370" y="316" width="137" height="22" rx="11" fill="#211c3d" stroke="#51418a"/>
  <circle cx="382" cy="327" r="3" fill="#b9a0ff"/>
  <text x="391" y="331" class="body violetText" font-size="10">INTERN · 2026</text>
  <text x="370" y="360" class="body muted" font-size="11.5">Data cleaning &amp; exploration</text>
  <text x="370" y="379" class="body muted" font-size="11.5">Dashboards &amp; data insights</text>
  <path d="M370 391 H630" stroke="#293752"/>

  <!-- TATA GROUP CARD -->
  <rect x="669" y="245" width="296" height="159" rx="14" class="card"/>
  <rect x="669" y="245" width="296" height="2" rx="1" fill="url(#red)"/>
  <rect x="687" y="262" width="44" height="44" rx="10" fill="#ffffff"/>
  <image
    x="691"
    y="266"
    width="38"
    height="38"
    preserveAspectRatio="xMidYMid meet"
    href="https://1000logos.net/wp-content/uploads/2020/04/Tata-Logo-1988.png"
/>
  <text x="740" y="278" class="head white" font-size="16">Tata Group</text>
  <text x="740" y="295" class="small redText" font-size="9">DATA ANALYTICS SIMULATION</text>
  <rect x="687" y="316" width="121" height="22" rx="11" fill="#351b2a" stroke="#713044"/>
  <circle cx="699" cy="327" r="3" fill="#ff7589"/>
  <text x="708" y="331" class="body redText" font-size="10">FORAGE · 2026</text>
  <text x="687" y="360" class="body muted" font-size="11.5">Exploratory data analysis</text>
  <text x="687" y="379" class="body muted" font-size="11.5">Risk insights &amp; strategy</text>
  <path d="M687 391 H947" stroke="#293752"/>

  <!-- BOTTOM -->
  <path d="M35 429 H965" stroke="#293752"/>
  <text x="40" y="455" class="small" fill="#8194b7">CURRENT FOCUS</text>
  <text x="40" y="480" class="body white" font-size="13" font-weight="600">Build. Analyse. Improve.</text>

  <g transform="translate(420 450)">
    <rect width="105" height="27" rx="7" fill="#111f36" stroke="#2b456b"/>
    <circle cx="13" cy="13.5" r="3" fill="#63c5ff"/>
    <text x="23" y="18" class="body" fill="#bfdfff" font-size="10.5">Frontend</text>
  </g>
  <g transform="translate(537 450)">
    <rect width="120" height="27" rx="7" fill="#211c3d" stroke="#51418a"/>
    <circle cx="13" cy="13.5" r="3" fill="#b9a0ff"/>
    <text x="23" y="18" class="body" fill="#d6c9ff" font-size="10.5">Data Analytics</text>
  </g>
  <g transform="translate(669 450)">
    <rect width="111" height="27" rx="7" fill="#351b2a" stroke="#713044"/>
    <circle cx="13" cy="13.5" r="3" fill="#ff7589"/>
    <text x="23" y="18" class="body" fill="#ffc0ca" font-size="10.5">Learning</text>
  </g>

  <rect x="35" y="500" width="930" height="2" rx="1" fill="#1a2740"/>
  <rect x="35" y="500" width="190" height="2" rx="1" fill="url(#flow)">
    <animate attributeName="x" values="35;775;35" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="width" values="170;250;170" dur="2.5s" repeatCount="indefinite"/>
  </rect>
</svg>
